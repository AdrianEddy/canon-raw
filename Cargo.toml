[workspace]
members = ["crm-container"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Adrian <adrian.eddy at gmail>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AdrianEddy/crm-rs"

[workspace.dependencies]
crm-container = { version = "0.2.1", path = "crm-container" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"

[package]
name = "canon-raw"
version = "0.1.0"
description = "Dynamically-loaded Rust bindings for Canon's Cinema RAW Light (CRM) SDK"
documentation = "https://docs.rs/canon-raw"
readme = "README.md"
keywords = ["canon", "cinema-raw", "crm", "raw", "video"]
categories = ["api-bindings", "external-ffi-bindings", "multimedia::video"]
include = [
    "/src",
    "/examples",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-Apache-2.0",
]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
atomic-waker = "1.1.2"
bitflags = "2.13.2"
crm-container.workspace = true
libloading = "0.9.0"
thiserror = "2.0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
static_assertions = "1.1.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_System_LibraryLoader"] }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]
